services:
  - type: web
    name: serviluz
    runtime: static
    buildCommand: echo "static"
    staticPublishPath: .
    pullRequestPreviewsEnabled: false
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
